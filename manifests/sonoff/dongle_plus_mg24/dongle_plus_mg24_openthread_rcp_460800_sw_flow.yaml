name: SONOFF Dongle Plus MG24 OpenThread RCP (460800, SW Flow)
device: EFR32MG24A420F1536IM48
base_project: src/openthread_rcp
filename: "{manifest_name}_{ot_rcp_version.split('/')[-1]}_gsdk_{sdk_version}"
sdk: "simplicity_sdk:2026.6.2"
toolchain: "llvm:23.1.0"

c_flags:
  - -O2
  - -flto=full

ld_flags:
  - -O2
  - -flto=full

gbl:
  fw_type: openthread_rcp
  ot_rcp_version: dynamic
  baudrate: 460800
  fw_variant: sw_flow

sdk_extension:
  - id: watchdog
    version: 1.0.0
    vendor: nabucasa

add_components:
  - id: watchdog
    vendor: nabucasa
    package: watchdog

sdk_patches:
  - disable_gp_rx_filter.patch
  - uart_tx_bounded_wait_sw_flow.patch
  - uart_tx_drop_on_timeout.patch

configuration:
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_SOFT

c_defines:
  OPENTHREAD_CONFIG_NCP_TX_BUFFER_SIZE:
    type: c_flag
    value: 4096  # Default is 2048

  SL_CLOCK_MANAGER_HFXO_FREQ: 38400000
  SL_CLOCK_MANAGER_HFXO_PRECISION: 10
  SL_CLOCK_MANAGER_HFXO_CTUNE: 130

  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL: EUSART1
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL_NO: 1
  SL_IOSTREAM_EUSART_VCOM_BAUDRATE: 460800
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_SOFT
  SL_IOSTREAM_EUSART_VCOM_TX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_EUSART_VCOM_TX_PIN: 1
  SL_IOSTREAM_EUSART_VCOM_RX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_EUSART_VCOM_RX_PIN: 2
  SL_IOSTREAM_EUSART_VCOM_RX_BUFFER_SIZE: 512
