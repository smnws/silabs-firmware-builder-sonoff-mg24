name: Build firmwares

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'README.md'
  push:
    paths-ignore:
      - '.gitignore'
      - 'README.md'
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  run-pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install
      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files

  list-manifests:
    name: List firmware manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      container_image: ${{ steps.set-matrix.outputs.container_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: set-matrix
        run: |
          tag_name=$(echo "${{ hashFiles('Dockerfile', 'uv.lock') }}" | cut -c-16)
          echo "container_image=ghcr.io/nabucasa/silabs-firmware-builder:${tag_name}" >> "$GITHUB_OUTPUT"
          echo "matrix=$(find manifests/sonoff -type f \( -name '*.yaml' -o -name '*.yml' \) -print | sort | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  build-firmwares:
    name: Build (${{ matrix.manifest }})
    needs: [list-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJson(needs.list-manifests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache ATfE toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: toolchains
          key: atfe-${{ hashFiles('tools/setup_toolchain.sh') }}

      - name: Setup ATfE toolchain
        run: ./tools/setup_toolchain.sh

      - name: Build firmware
        id: build-firmware
        env:
          CONTAINER_IMAGE: ${{ needs.list-manifests.outputs.container_image }}
          MATRIX_MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          mkdir -p outputs
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint /bin/bash \
            "${CONTAINER_IMAGE}" \
            -c "
              set -euo pipefail
              export HOME=/tmp/home
              mkdir -p \"\$HOME\"
              /opt/venv/bin/python3 -m tools.build_project \
                --manifest '${MATRIX_MANIFEST}' \
                --build-dir build \
                --output-dir outputs \
                --output gbl \
                --output hex \
                --output out
              chown -R $(id -u):$(id -g) /repo/outputs
            "

          output_basename=$(basename -- "$(ls -1 outputs/*.gbl | head -n 1)" .gbl)
          echo "output_basename=${output_basename}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-build-${{ steps.build-firmware.outputs.output_basename }}
          path: outputs/*
          compression-level: 9
          if-no-files-found: error

  generate-manifest:
    name: Generate manifest
    needs: [list-manifests, build-firmwares]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: firmware-build-*

      - name: Generate manifest
        env:
          CONTAINER_IMAGE: ${{ needs.list-manifests.outputs.container_image }}
        run: |
          set -euo pipefail
          docker pull "${CONTAINER_IMAGE}"
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint /bin/bash \
            "${CONTAINER_IMAGE}" \
            -c "
              set -euo pipefail
              /opt/venv/bin/python3 -m tools.create_manifest \
                --manifests manifests/sonoff \
                --artifacts artifacts
            " > artifacts/manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          path: artifacts/manifest.json
          compression-level: 9
          if-no-files-found: error

  release-assets:
    name: Upload release assets
    needs: [generate-manifest]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: manifest

      - name: Download all workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: firmware-build-*

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --clobber \
            artifacts/*.gbl \
            artifacts/manifest.json
